<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b101b" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="codeklar" />
    <meta
      name="description"
      content="Verstehe Operatoren und Methoden, übe JavaScript und lerne unterwegs – auch offline."
    />
    <title>codeklar – Verstehe deinen Code</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      (() => {
        let accent = "green", mode = "dark";
        try {
          const savedAccent = localStorage.getItem("codeklar-accent-v1");
          const savedMode = localStorage.getItem("codeklar-theme-v1");
          if (["purple", "blue", "green", "amber", "rose"].includes(savedAccent)) accent = savedAccent;
          if (["light", "dark", "system"].includes(savedMode)) mode = savedMode;
        } catch {}
        const theme = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
        document.documentElement.dataset.accent = accent;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#f5f8f6" : "#0e1514";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
